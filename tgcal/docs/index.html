<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
/* ============================ ТЕМЫ ============================ */
:root, [data-theme="midnight"] {
  --bg:#0f0f10; --panel:#1a1a1c; --panel2:#252528; --tx:#f2f2ee; --mut:#8e8e95;
  --ac:#dfe5a0; --acbg:linear-gradient(135deg,#e8eeab,#cdcdf2); --acink:#17171a;
  --card:#2a2a30; --cardink:#f2f2ee; --line:#2d2d33; --now:#ff6b6b; --good:#52c791; --bad:#b83a52;
}
[data-theme="black"]      { --bg:#000; --panel:#0b0b0c; --panel2:#161617; --tx:#e9e9ea; --mut:#77777c; --ac:#c9c9d1; --acbg:#c9c9d1; --acink:#000; --card:#1a1a1c; --cardink:#e9e9ea; --line:#1d1d1f; --now:#ff6b6b; --good:#4fbf88; --bad:#a8364c; }
[data-theme="indigo"]     { --bg:#dde5f3; --panel:#ecf1fa; --panel2:#ffffff; --tx:#1a2250; --mut:#7380a6; --ac:#5a4fcf; --acbg:#5a4fcf; --acink:#fff; --card:#5a4fcf; --cardink:#fff; --line:#cdd7ea; --now:#e5484d; --good:#2f9e66; --bad:#c0394f; }
[data-theme="emerald"]    { --bg:#101a16; --panel:#1a2a24; --panel2:#233830; --tx:#e9f2ec; --mut:#86a095; --ac:#f2c53d; --acbg:#f2c53d; --acink:#1a1a12; --card:#3f6b59; --cardink:#f3fbf6; --line:#2a3f36; --now:#ff7a59; --good:#5fd39a; --bad:#b83a52; }
[data-theme="bordeaux"]   { --bg:#17171a; --panel:#222228; --panel2:#2c2c34; --tx:#efeff2; --mut:#8f8f9b; --ac:#e0486d; --acbg:linear-gradient(135deg,#d1345b,#8f1d3f); --acink:#fff; --card:#6d1a37; --cardink:#fff; --line:#34343d; --now:#ffb347; --good:#52c791; --bad:#9d2942; }
[data-theme="teal"]       { --bg:#0b1b21; --panel:#12303a; --panel2:#194150; --tx:#e6f6f4; --mut:#7fa7ab; --ac:#4de3c2; --acbg:#4de3c2; --acink:#05211c; --card:#1f6f78; --cardink:#eafffb; --line:#1e4652; --now:#ff8a6b; --good:#4de3c2; --bad:#c2455a; }
[data-theme="terracotta"] { --bg:#e8d3c6; --panel:#f6efe9; --panel2:#ffffff; --tx:#3a2e33; --mut:#a09089; --ac:#d9593a; --acbg:#d9593a; --acink:#fff; --card:#3a2e33; --cardink:#f6efe9; --line:#e6d8cf; --now:#d9593a; --good:#4c9a6a; --bad:#b8452f; }
[data-theme="sage"]       { --bg:#eef2e0; --panel:#d9e6b4; --panel2:#fbfcf7; --tx:#1d2415; --mut:#66784d; --ac:#5f8226; --acbg:#5f8226; --acink:#fff; --card:#5f8226; --cardink:#fff; --line:#c6d89c; --now:#d1493a; --good:#3f8a45; --bad:#c0394f; }
[data-theme="luxury"]     { --bg:#e9ecf2; --panel:#f8f7f4; --panel2:#ffffff; --tx:#1b2438; --mut:#8a8f9c; --ac:#1f2a44; --acbg:#1f2a44; --acink:#fff; --card:#1f2a44; --cardink:#f8f7f4; --line:#e4e0d8; --now:#b8905a; --good:#3f8f6a; --bad:#b6414f; }
/* вишнёвая палитра: тёмный фон + вишня #8E1C2E + второй цвет */
[data-theme^="cherry"]    { --bg:#141417; --panel:#1d1d21; --panel2:#26262b; --tx:#f1f0f2; --mut:#8f8d94; --card:#8E1C2E; --cardink:#fff; --line:#2e2e34; --now:#ff6b6b; --good:#52c791; --bad:#8E1C2E; }
[data-theme="cherry-champagne"] { --ac:#E6D3B3; --acbg:#E6D3B3; --acink:#2a1a14; }
[data-theme="cherry-honey"]     { --ac:#D4925F; --acbg:#D4925F; --acink:#2a1608; }
[data-theme="cherry-lavender"]  { --ac:#B8B3FF; --acbg:#B8B3FF; --acink:#1a1840; }
[data-theme="cherry-ice"]       { --ac:#A6DCF2; --acbg:#A6DCF2; --acink:#0c2230; }
[data-theme="cherry"]           { --ac:#C23049; --acbg:#B3263C; --acink:#fff; --bad:#7d1626; }

/* ============================ БАЗА ============================ */
:root {
  --rn: 22; --td: 7;                     /* скругление 0…50 и яркость плиток 0…30 — настройки */
  --r:  calc(var(--rn) * 1%);
  --rc: calc(8px + var(--rn) * .5px);
  --rw: calc(var(--rn) * .9px);
  --rs: calc(var(--rn) * .35px);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; background: var(--bg); }
body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--tx);
  font: 500 15px/1.35 Onest, system-ui, sans-serif; padding: calc(var(--sat) + 12px) 14px 0; max-width: 520px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; }

header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; min-height: 52px; }
.nav { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ttlbox { min-width: 0; margin: 0 4px; }
h1 { margin: 0; font-size: 21px; line-height: 1.15; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subl { font-size: 12.5px; color: var(--mut); min-height: 16px; display: block; }
button.subl { color: var(--ac); font-weight: 600; text-align: left; }
.ic { width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--rs); background: var(--panel); color: var(--tx); flex: none; }
.ic:active { transform: scale(.94); }
.hr2 { display: flex; gap: 6px; }

.seg { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--panel); border-radius: var(--rc); margin-bottom: 10px; }
.seg button { padding: 9px 0; border-radius: calc(var(--rc) - 4px); color: var(--mut); font-weight: 600; transition: background .2s, color .2s; }
.seg button.on { background: var(--acbg); color: var(--acink); }
#chips { flex: none; display: none; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
#chips.on { display: flex; }
#chips::-webkit-scrollbar { display: none; }
#chips .chip { white-space: nowrap; }

/* фиксированная область: страница не прыгает, прокручивается только #main */
#main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(var(--sab) + 100px); scrollbar-width: none; }
#main::-webkit-scrollbar { display: none; }
#main > * { animation: fadein .16s ease-out; }
@keyframes fadein { from { opacity: 0 } }
.panel { background: var(--panel); border-radius: calc(var(--rc) + 6px); padding: 14px; }
.sub { color: var(--mut); font-size: 13px; }

/* ============================ МЕСЯЦ ============================ */
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { text-align: center; color: var(--mut); font-size: 12px; font-weight: 600; padding-bottom: 4px; }
.tile { aspect-ratio: 1; border-radius: var(--r); background: var(--panel2); background: color-mix(in srgb, var(--tx) calc(var(--td) * 1%), var(--panel));
  display: grid; place-items: center; position: relative; font-weight: 600; font-size: 15px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tile:active { transform: scale(.95); }
.tile .n { position: relative; z-index: 2; }
.tile.out { opacity: .38; }
.tile.today { box-shadow: inset 0 0 0 2px var(--ac); }
.tile.sel { background: var(--acbg); color: var(--acink); box-shadow: none; }
.tile.ring.sel, .wtile.ring.sel { background: transparent; color: var(--tx); }
.tile.ring.today, .wtile.ring.today { box-shadow: none; }
.dots { position: absolute; bottom: 12%; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; z-index: 2; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--ac); }
.sel:not(.ring) .dots i { background: var(--acink); }
.mk { position: absolute; left: -7%; top: -7%; width: 114%; height: 114%; pointer-events: none; overflow: visible; z-index: 1; }
.mk path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mk.done path { stroke: var(--good); } .mk.miss path { stroke: var(--bad); } .mk.star path { stroke: var(--ac); }
.mk.scr path { stroke-width: 9; opacity: .92; } .mk.stk path { stroke-width: 17; opacity: .9; }
.mk.ringp path { stroke-width: 4.2; }
.mkdot { position: absolute; top: 9%; right: 9%; width: 9px; height: 9px; border-radius: 50%; z-index: 2; }
.mkdot.done { background: var(--good); } .mkdot.miss { background: var(--bad); } .mkdot.star { background: var(--ac); }
.ringsel path { stroke: var(--tx); } .ringtod path { stroke: var(--ac); }
.tile.sel.ring .mk.ringsel, .wtile.sel.ring .mk.ringsel { display: block; }

/* ============================ НЕДЕЛЯ ============================ */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wtile { aspect-ratio: 3 / 4.2; border-radius: var(--rw); background: var(--panel2); background: color-mix(in srgb, var(--tx) calc(var(--td) * 1%), var(--panel));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; user-select: none; -webkit-touch-callout: none; }
.wtile small { color: var(--mut); font-size: 12px; font-weight: 600; position: relative; z-index: 2; }
.wtile b { font-size: 17px; font-weight: 650; position: relative; z-index: 2; }
.wtile.today { box-shadow: inset 0 0 0 2px var(--ac); }
.wtile.sel { background: var(--acbg); color: var(--acink); box-shadow: none; }
.wtile.sel small { color: inherit; opacity: .75; }
.wtile .dots { bottom: 9%; }

/* ============================ ДЕНЬ ============================ */
.sect { margin: 16px 2px 8px; font-weight: 650; font-size: 17px; display: flex; align-items: center; justify-content: space-between; }
.sect button { font-size: 13px; font-weight: 600; color: var(--ac); }
.tl { display: flex; flex-direction: column; }
.hr { display: grid; grid-template-columns: 52px 1fr; align-items: stretch; min-height: 62px; }
.hl { color: var(--mut); font-size: 13px; font-weight: 600; padding-top: 6px; }
.slot { position: relative; padding: 4px 0; display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); min-height: 62px; }
.slot.empty::after { content: "Добавить"; position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--mut); font-size: 13px; opacity: .55; }
.slot:active { background: color-mix(in srgb, var(--panel) 80%, transparent); border-radius: var(--rs); }
.ev { width: 100%; text-align: left; background: var(--card); color: var(--cardink); border-radius: var(--rc); padding: 11px 14px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 6px 18px -10px rgba(0,0,0,.5); }
.ev b { font-weight: 650; font-size: 16px; }
.ev small { opacity: .8; font-size: 13px; }
.ev .tag { font-size: 12px; opacity: .78; }
.ev.allday { background: var(--panel); color: var(--tx); box-shadow: inset 0 0 0 1.5px var(--ac); }
.now { position: absolute; left: -6px; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 2; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -1px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.agenda { display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--mut); text-align: center; padding: 18px 8px; }
.addrow { width: 100%; padding: 12px; border-radius: var(--rc); border: 1.5px dashed var(--line); color: var(--mut); font-weight: 600; }

.fab { position: fixed; right: max(18px, calc(50% - 242px)); bottom: calc(var(--sab) + 22px); width: 58px; height: 58px; border-radius: calc(var(--rc) + 4px); background: var(--acbg); color: var(--acink); display: grid; place-items: center; box-shadow: 0 12px 28px -8px rgba(0,0,0,.55); z-index: 5; }
.fab:active { transform: scale(.94); }

/* ============================ ЛИСТЫ ============================ */
.sheet { position: fixed; inset: 0; z-index: 20; display: none; }
.sheet.open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fadein .2s; }
.sheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: calc(var(--rc) + 8px) calc(var(--rc) + 8px) 0 0; padding: 18px 16px calc(var(--sab) + 24px); animation: up .25s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.box h2 { margin: 0 0 14px; font-size: 20px; font-weight: 650; }
.box h3 { margin: 22px 0 8px; font-size: 14px; font-weight: 650; color: var(--mut); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label, .lbl { font-size: 13px; color: var(--mut); font-weight: 600; }
.in { width: 100%; background: var(--panel); border: 1.5px solid transparent; border-radius: var(--rc); padding: 12px 14px; outline: none; min-height: 46px; }
.in:focus { border-color: var(--ac); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 13px; border-radius: var(--rs); background: var(--panel); font-weight: 600; font-size: 14px; color: var(--mut); }
.chip.on { background: var(--acbg); color: var(--acink); }
.chip.lock { opacity: .55; }
.sw { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--panel); border-radius: var(--rc); margin-bottom: 12px; }
.tg { width: 46px; height: 28px; border-radius: 14px; background: var(--panel2); position: relative; transition: background .2s; flex: none; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--mut); transition: .2s; }
.tg.on { background: var(--acbg); } .tg.on::after { left: 21px; background: var(--acink); }
.btn { width: 100%; padding: 14px; border-radius: var(--rc); background: var(--acbg); color: var(--acink); font-weight: 650; font-size: 16px; }
.btn.alt { background: var(--panel); color: var(--tx); }
.btn.danger { background: transparent; color: var(--now); box-shadow: inset 0 0 0 1.5px var(--now); }
.btn.sm { padding: 10px; font-size: 14px; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.th { width: 100%; aspect-ratio: 1; border-radius: var(--rs); position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(128,128,128,.3); }
.th i { position: absolute; left: 22%; right: 22%; bottom: 20%; height: 28%; border-radius: 30%; }
.th b { position: absolute; left: 22%; top: 18%; width: 28%; height: 28%; border-radius: 30%; opacity: .9; }
.th.on { outline: 3px solid var(--ac); outline-offset: 2px; }
.th .lk { position: absolute; top: 4px; right: 5px; font-size: 11px; }
.th-name { text-align: center; font-size: 11px; color: var(--mut); margin-top: 4px; }
input[type=range] { width: 100%; accent-color: var(--ac); height: 30px; }
.prev { display: flex; gap: 8px; margin-top: 6px; }
.prev .tile { width: 48px; flex: none; }
.plan { background: var(--panel); border-radius: calc(var(--rc) + 4px); padding: 14px; margin-bottom: 10px; }
.plan.cur { box-shadow: inset 0 0 0 2px var(--ac); }
.plan h4 { margin: 0 0 6px; font-size: 17px; display: flex; justify-content: space-between; }
.plan ul { margin: 6px 0 10px; padding-left: 18px; color: var(--mut); font-size: 13.5px; } .plan li { margin: 2px 0; }
.plan .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan .prices button { padding: 11px 6px; border-radius: var(--rs); background: var(--acbg); color: var(--acink); font-weight: 650; font-size: 14px; }
.plan .prices button.alt { background: var(--panel2); color: var(--tx); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--panel); border-radius: var(--rc); margin-bottom: 8px; }
.kv small { color: var(--mut); display: block; font-size: 12.5px; }
.kv .mini { padding: 8px 12px; border-radius: var(--rs); background: var(--acbg); color: var(--acink); font-weight: 650; font-size: 13px; white-space: nowrap; }
.kv .mini.alt { background: var(--panel2); color: var(--tx); }
code.url, pre.codes { display: block; word-break: break-all; font-size: 12px; color: var(--mut); margin-top: 4px; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; }
pre.codes { background: var(--panel); padding: 12px; border-radius: var(--rc); color: var(--tx); font-size: 13.5px; }
.ex { display: block; width: 100%; text-align: left; background: var(--panel); border-radius: var(--rc); padding: 11px 14px; margin-bottom: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; }
.ex small { display: block; color: var(--mut); font-family: Onest, system-ui, sans-serif; font-size: 12px; margin-top: 3px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.stat div { background: var(--panel); border-radius: var(--rc); padding: 10px; text-align: center; } .stat b { display: block; font-size: 20px; } .stat span { font-size: 12px; color: var(--mut); }
.crow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; background: var(--panel); border-radius: var(--rs); margin-bottom: 6px; font-size: 13px; }
.crow code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; }
.crow.off { opacity: .45; text-decoration: line-through; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 96px); translate: -50% 0; background: var(--tx); color: var(--bg); padding: 11px 16px; border-radius: var(--rc); font-weight: 600; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86vw; text-align: center; }
#toast.on { opacity: 1; }
button:focus-visible, .in:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

/* ===== v2.1 ===== */
:root, [data-theme="midnight"], [data-theme="black"], [data-theme="emerald"], [data-theme="bordeaux"], [data-theme="teal"], [data-theme^="cherry"] { color-scheme: dark; }
[data-theme="indigo"], [data-theme="terracotta"], [data-theme="sage"], [data-theme="luxury"] { color-scheme: light; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; padding-right: 42px; cursor: pointer; }
.sel::after { content: ""; position: absolute; right: 17px; top: 50%; width: 8px; height: 8px; border-right: 2.2px solid var(--mut); border-bottom: 2.2px solid var(--mut); transform: translateY(-72%) rotate(45deg); pointer-events: none; border-radius: 1px; }
.timebtn { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--rc); background: var(--panel); font-weight: 650; font-size: 18px; text-align: center; letter-spacing: .02em; border: 1.5px solid transparent; }
.timebtn:active { border-color: var(--ac); }
.timebtn.sm { width: auto; min-width: 86px; min-height: 40px; font-size: 16px; background: var(--panel2); }
.pk { max-width: 420px; }
.pkbig { display: flex; justify-content: center; align-items: baseline; gap: 6px; font-size: 52px; font-weight: 650; margin: 2px 0 14px; letter-spacing: -.02em; }
.pkbig i { font-style: normal; color: var(--mut); }
.pkgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pkc { padding: 11px 0; border-radius: var(--rs); background: var(--panel); font-weight: 600; font-variant-numeric: tabular-nums; }
.pkc.on { background: var(--acbg); color: var(--acink); }
.stp { display: inline-flex; align-items: center; background: var(--panel2); border-radius: var(--rs); overflow: hidden; flex: none; }
.stp button { width: 40px; height: 40px; font-size: 22px; font-weight: 500; color: var(--tx); }
.stp button:active { background: var(--line); }
.stp b { min-width: 44px; text-align: center; font-size: 16px; }
.crow2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plate { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; background: var(--panel); border-radius: calc(var(--rc) + 2px); padding: 14px 16px; margin: 0 0 10px; box-shadow: inset 0 0 0 1.5px var(--ac); }
.plate b { display: block; font-size: 16px; } .plate small { color: var(--mut); font-size: 12.5px; }
.plate.static { box-shadow: none; }
.acc { background: var(--panel); border-radius: calc(var(--rc) + 2px); margin-bottom: 10px; overflow: hidden; }
.acch { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; font-weight: 650; font-size: 16px; text-align: left; }
.acch svg { transition: transform .2s; color: var(--mut); }
.acc.open .acch svg { transform: rotate(180deg); }
.accb { display: none; padding: 2px 14px 16px; }
.acc.open .accb { display: block; }
.accb .kv { background: var(--panel2); }
.accb .crow { background: var(--panel2); }
.ev { flex-direction: row; align-items: center; gap: 6px; padding: 6px 8px 6px 4px; }
.evm { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 7px 8px 7px 12px; color: inherit; }
.evm b { font-weight: 650; font-size: 16px; }
.evb { display: flex; gap: 6px; flex: none; }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: rgba(127,127,127,.18); color: inherit; transition: background .15s, transform .1s; }
.ib:active { transform: scale(.9); }
.ib.ck.on { background: var(--good); color: #0b1f14; }
.cd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.ev.done .evm small, .ev.done .evm .tag { opacity: .55; }
[data-done="strike"] .ev.done .evm b { text-decoration: line-through; text-decoration-thickness: 2.2px; opacity: .7; }
[data-done="marker"] .ev.done .evm b { background: linear-gradient(transparent 42%, color-mix(in srgb, var(--good) 85%, transparent) 42% 66%, transparent 66%); }
[data-done="fade"] .ev.done { opacity: .45; }

/* ===== многодневные задачи: линии поверх плиток (сетка не меняется) ===== */
.gw { position: relative; }
.bars { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 6px; row-gap: 6px; pointer-events: none; z-index: 3; }
.bar { display: block; height: 4px; align-self: end; box-shadow: 0 0 0 1px rgba(0,0,0,.22); }
.tile.hasbar .dots, .wtile.hasbar .dots { bottom: auto; top: 8%; }
.acct { display: flex; flex-direction: column; min-width: 0; }
.acct small { color: var(--mut); font-weight: 500; font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }
</style>
</head>
